# Definiciones de servidores en la infraestructura
# Actualizado: 2026-03-09

servers:
  # UREK - Servidor principal de home/lab
  - id: srv-urek
    hostname: urek
    ip: 100.70.74.125
    tailscale_ip: 100.70.74.125
    provider: bare-metal
    region: home-santiago
    os: ubuntu-22.04
    ram_gb: 3.7
    storage_gb: 117
    services:
      - svc-homeassistant
      - svc-n8n
      - svc-minio
      - svc-portainer
      - svc-browserless
      - svc-organizr
      - svc-mosquitto
      - svc-cloudflared
      - svc-jupyterlab
    databases:
      - db-urek-postgres
      - db-urek-mongo
      - db-urek-webdb
    tags:
      - production
      - lab
      - home-automation

